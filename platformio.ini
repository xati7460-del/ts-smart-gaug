[env:esp32-2432s028-st7789]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.flash_size = 4MB
board_build.partitions = default.csv
lib_deps =
    bodmer/TFT_eSPI
build_flags =
    -D USER_SETUP_LOADED
    -include ${PROJECT_DIR}/TFT_eSPI_User_Setup.h
